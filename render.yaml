# Render Blueprint for Restaurant Order Management System

services:
  # Backend API Service
  - type: web
    name: restaurant-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Frontend Static Site (Alternative: can use Vercel instead)
  # Uncomment if you want to host frontend on Render too
  # - type: web
  #   name: restaurant-frontend
  #   env: static
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
  #   rootDir: client
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
  #   envVars:
  #     - key: VITE_API_URL
  #       value: https://restaurant-backend.onrender.com/api
  #     - key: VITE_SOCKET_URL
  #       value: https://restaurant-backend.onrender.com

databases:
  - name: restaurant-db
    databaseName: restaurant_db
    plan: free
    region: oregon
